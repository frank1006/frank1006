<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" width="800" height="330" role="img" aria-labelledby="t d">
  <title id="t">Farhan Bashir</title>
  <desc id="d">Full-stack engineer and founder. Ships web apps, mobile apps, online stores and dashboards. Open to roles, fully remote.</desc>
  <style>
    .b{animation:drop .9s cubic-bezier(.16,1,.3,1) both}
    .b1{animation-delay:.15s}.b2{animation-delay:.4s}.b3{animation-delay:.65s}.b4{animation-delay:.9s}
    .slide{animation:slide 2.6s ease-in-out 1.9s infinite alternate}
    .up{animation:rise .9s cubic-bezier(.16,1,.3,1) both}
    .u2{animation-delay:.12s}.u3{animation-delay:.24s}.u4{animation-delay:.36s}
    .w{opacity:0;animation:word 12s cubic-bezier(.16,1,.3,1) infinite}
    .w1{opacity:1}.w2{animation-delay:3s}.w3{animation-delay:6s}.w4{animation-delay:9s}
    .dot{animation:pulse 2.4s ease-in-out infinite}
    @keyframes drop{from{opacity:0;transform:translateY(-120px)}to{opacity:1;transform:none}}
    @keyframes slide{from{transform:translateX(-16px)}to{transform:translateX(18px)}}
    @keyframes rise{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
    @keyframes word{0%{opacity:0;transform:translateY(12px)}4%,21%{opacity:1;transform:none}25%,100%{opacity:0;transform:translateY(-12px)}}
    @keyframes pulse{50%{opacity:.35}}
    @media (prefers-reduced-motion:reduce){.b,.slide,.up,.w,.dot{animation:none}}
  </style>
  <defs>
    <pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0v40" fill="none" stroke="#1d2024" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0c0d0f" stop-opacity="1"/>
      <stop offset=".5" stop-color="#0c0d0f" stop-opacity=".9"/>
      <stop offset="1" stop-color="#0c0d0f" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="r"><rect width="800" height="330" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#r)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
    <rect width="800" height="330" fill="#0c0d0f"/>
    <rect width="800" height="330" fill="url(#g)"/>
    <rect width="800" height="330" fill="url(#fade)"/>
    <!-- blocks drop in and stack; the top one keeps sliding, as in Stackline -->
    <g transform="translate(596 152)">
      <g class="b b1"><rect x="0" y="108" width="156" height="28" rx="6" fill="#26292e"/></g>
      <g class="b b2"><rect x="26" y="72" width="130" height="28" rx="6" fill="#33373d"/></g>
      <g class="b b3"><rect x="12" y="36" width="124" height="28" rx="6" fill="#26292e"/></g>
      <g class="b b4"><g class="slide"><rect x="32" y="0" width="98" height="28" rx="6" fill="#14b8a6"/></g></g>
    </g>
    <g transform="translate(48 0)">
      <g class="up">
        <rect class="dot" y="47" width="12" height="12" rx="6" fill="#14b8a6"/>
        <text x="24" y="60" font-size="21" font-weight="600" letter-spacing="2" fill="#b9bbbf">OPEN TO ROLES · FULLY REMOTE</text>
      </g>
      <text class="up u2" y="156" font-size="88" font-weight="700" letter-spacing="-3.4" fill="#f1efea">Farhan Bashir</text>
      <text class="up u3" y="218" font-size="35" font-weight="500" letter-spacing="-.5" fill="#f1efea">Full-stack engineer and founder.</text>
      <g class="up u4" font-size="35" font-weight="500" letter-spacing="-.5">
        <text y="276" fill="#b9bbbf">I ship</text>
        <g fill="#2dd4bf" font-weight="700">
          <text class="w w1" x="110" y="276">web apps</text>
          <text class="w w2" x="110" y="276">mobile apps</text>
          <text class="w w3" x="110" y="276">online stores</text>
          <text class="w w4" x="110" y="276">dashboards</text>
        </g>
      </g>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-labelledby="t d">
  <title id="t">Farhan Bashir</title>
  <desc id="d">Full-stack engineer. Founder of two startups. Ships web apps, mobile apps, online stores and dashboards. Open to roles, fully remote.</desc>
  <style>
    .b{animation:drop .9s cubic-bezier(.16,1,.3,1) both}
    .b1{animation-delay:.15s}.b2{animation-delay:.4s}.b3{animation-delay:.65s}.b4{animation-delay:.9s}
    .slide{animation:slide 2.6s ease-in-out 1.9s infinite alternate}
    .up{animation:rise .9s cubic-bezier(.16,1,.3,1) both}
    .u2{animation-delay:.12s}.u3{animation-delay:.24s}.u4{animation-delay:.36s}
    .w{opacity:0;animation:word 12s cubic-bezier(.16,1,.3,1) infinite}
    .w1{opacity:1}.w2{animation-delay:3s}.w3{animation-delay:6s}.w4{animation-delay:9s}
    .dot{animation:pulse 2.4s ease-in-out infinite}
    @keyframes drop{from{opacity:0;transform:translateY(-150px)}to{opacity:1;transform:none}}
    @keyframes slide{from{transform:translateX(-26px)}to{transform:translateX(30px)}}
    @keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
    @keyframes word{0%{opacity:0;transform:translateY(14px)}4%,21%{opacity:1;transform:none}25%,100%{opacity:0;transform:translateY(-14px)}}
    @keyframes pulse{50%{opacity:.35}}
    @media (prefers-reduced-motion:reduce){.b,.slide,.up,.w,.dot{animation:none}}
  </style>
  <defs>
    <pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0v40" fill="none" stroke="#dcd7cd" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f4f2ee" stop-opacity="1"/>
      <stop offset=".55" stop-color="#f4f2ee" stop-opacity=".92"/>
      <stop offset="1" stop-color="#f4f2ee" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="r"><rect width="1200" height="340" rx="20"/></clipPath>
  </defs>
  <g clip-path="url(#r)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
    <rect width="1200" height="340" fill="#f4f2ee"/>
    <rect width="1200" height="340" fill="url(#g)"/>
    <rect width="1200" height="340" fill="url(#fade)"/>
    <!-- blocks drop in and stack; the top one keeps sliding, as in Stackline -->
    <g transform="translate(900 64)">
      <g class="b b1"><rect x="0" y="168" width="240" height="46" rx="8" fill="#ddd8cf"/></g>
      <g class="b b2"><rect x="40" y="112" width="200" height="46" rx="8" fill="#111214"/></g>
      <g class="b b3"><rect x="20" y="56" width="190" height="46" rx="8" fill="#ddd8cf"/></g>
      <g class="b b4"><g class="slide"><rect x="50" y="0" width="150" height="46" rx="8" fill="#14b8a6"/></g></g>
    </g>
    <g transform="translate(64 0)">
      <g class="up">
        <rect class="dot" y="56" width="10" height="10" rx="5" fill="#14b8a6"/>
        <text x="22" y="67" font-size="20" font-weight="600" letter-spacing="2.4" fill="#4b4d52">OPEN TO ROLES · FULLY REMOTE</text>
      </g>
      <text class="up u2" y="162" font-size="92" font-weight="700" letter-spacing="-3.5" fill="#111214">Farhan Bashir</text>
      <text class="up u3" y="216" font-size="32" font-weight="500" letter-spacing="-.4" fill="#111214">Full-stack engineer. <tspan fill="#4b4d52">Founder of two startups.</tspan></text>
      <g class="up u4" font-size="32" font-weight="500" letter-spacing="-.4">
        <text y="270" fill="#4b4d52">I ship</text>
        <g fill="#0b6b61" font-weight="700">
          <text class="w w1" x="102" y="270">web apps</text>
          <text class="w w2" x="102" y="270">mobile apps</text>
          <text class="w w3" x="102" y="270">online stores</text>
          <text class="w w4" x="102" y="270">enterprise dashboards</text>
        </g>
      </g>
    </g>
  </g>
</svg>
